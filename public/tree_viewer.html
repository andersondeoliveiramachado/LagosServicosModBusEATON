            font-weight: 800; font-size: 16px;

        details > summary::-webkit-details-marker { display: none; }
        details[open] > summary .chevron { transform: rotate(90deg); }

const themeToggle = document.getElementById('themeToggle');
const iconSun = document.getElementById('themeIconSun');
const iconMoon = document.getElementById('themeIconMoon');
function setTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    iconSun.classList.toggle('hidden', !dark);
    iconSun.classList.toggle('block', dark);
    iconMoon.classList.toggle('hidden', dark);
    iconMoon.classList.toggle('block', !dark);
    localStorage.setItem('theme', dark ? 'dark' : 'light');
}
themeToggle.addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark')));
if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    setTheme(true);
}

// Separar seções de registradores
function parseData(data) {
    const sections = [];
    let currentSection = null;

    data.forEach(item => {
        if (item._secao || item._comentario) {
            currentSection = {
                title: item._secao || item._comentario,
                description: item._descricao || item._fonte || '',
                notes: [],
                registers: []
            };
            // Coleta notas
            Object.keys(item).forEach(k => {
                if (k.startsWith('_nota')) currentSection.notes.push(item[k]);
                if (k.startsWith('_grupo')) currentSection.notes.push(item[k]);
            });
            sections.push(currentSection);
        } else if (item.address !== undefined && currentSection) {
            currentSection.registers.push(item);
        } else if (item.address !== undefined && !currentSection) {
            // registrador sem seção
            if (sections.length === 0) {
                sections.push({ title: 'Registradores', description: '', notes: [], registers: [] });
            }
            sections[0].registers.push(item);
        }
    });

    return sections.filter(s => s.registers.length > 0 || s.notes.length > 0);
}

function getFcBadgeClass(fc) {
    if (!fc) return 'bg-slate-500';
    if (fc === 'FC02') return 'badge-fc02';
    if (fc === 'FC03') return 'badge-fc03';
    if (fc === 'FC04') return 'badge-fc04';
    return 'bg-slate-500';
}

function getTypeIcon(dt) {
    if (!dt) return '📦';
    if (dt === 'boolean') return '🔘';
    if (dt.includes('int') || dt.includes('uint')) return '📊';
    if (dt.includes('string')) return '🏷️';
    return '📦';
}

function renderStats(sections) {
    const allRegs = sections.flatMap(s => s.registers);
    const fc02 = allRegs.filter(r => r.function_code === 'FC02').length;
    const fc03 = allRegs.filter(r => r.function_code === 'FC03').length;
    const fc04 = allRegs.filter(r => r.function_code === 'FC04').length;
    const withLimits = allRegs.filter(r => r.min !== undefined || r.max !== undefined).length;

    const stats = [
        { label: 'Total Registradores', value: allRegs.length, color: 'text-indigo-600 dark:text-indigo-400', bg: 'bg-indigo-50 dark:bg-indigo-900/20 border-indigo-200 dark:border-indigo-800/50' },
        { label: 'FC02 (Discretos)', value: fc02, color: 'text-cyan-600 dark:text-cyan-400', bg: 'bg-cyan-50 dark:bg-cyan-900/20 border-cyan-200 dark:border-cyan-800/50' },
        { label: 'FC03 (Holding)', value: fc03, color: 'text-purple-600 dark:text-purple-400', bg: 'bg-purple-50 dark:bg-purple-900/20 border-purple-200 dark:border-purple-800/50' },
        { label: 'FC04 (Input)', value: fc04, color: 'text-amber-600 dark:text-amber-400', bg: 'bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-800/50' },
        { label: 'Com Limites', value: withLimits, color: 'text-emerald-600 dark:text-emerald-400', bg: 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800/50' },
    ];

    document.getElementById('statsBar').innerHTML = stats.map(s => `
        <div class="p-4 rounded-xl border ${s.bg} transition-all hover:shadow-sm">
            <p class="text-[10px] font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-1">${s.label}</p>
            <p class="text-2xl font-black mono ${s.color}">${s.value}</p>
        </div>
    `).join('');
}

function renderTree(sections, filter = '') {
    const container = document.getElementById('treeContainer');
    const filterLower = filter.toLowerCase();

    let html = '';
    let matchCount = 0;

    sections.forEach((section, sIdx) => {
        let regs = section.registers;
        if (filterLower) {
            regs = regs.filter(r => 
                r.name.toLowerCase().includes(filterLower) ||
                (r.description || '').toLowerCase().includes(filterLower) ||
                String(r.address).includes(filterLower) ||
                (r.function_code || '').toLowerCase().includes(filterLower) ||
                (r.unit || '').toLowerCase().includes(filterLower)
            );
        }
        if (regs.length === 0 && filterLower) return;
        matchCount += regs.length;

        // Agrupa por subcategoria deduziu pelos nomes
        const groups = {};
        regs.forEach(r => {
            const fc = r.function_code || 'N/A';
            const uid = r.uid !== undefined ? `UID ${r.uid}` : '';
            const key = `${fc}${uid ? ' — ' + uid : ''}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(r);
        });

        const isOpen = filterLower ? true : false;
        html += `
        <details class="section-glow bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 overflow-hidden transition-all" ${isOpen ? 'open' : ''}>
            <summary class="p-5 flex items-center gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors select-none">
                <svg class="w-4 h-4 text-slate-400 chevron shrink-0 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                <div class="flex-1 min-w-0">
                    <h2 class="text-sm font-bold text-slate-800 dark:text-slate-200 truncate">${highlightText(section.title, filterLower)}</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">${section.description}</p>
                </div>
                <span class="text-[10px] mono font-bold px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 shrink-0">${regs.length} reg.</span>
            </summary>
            <div class="px-5 pb-5">
                ${section.notes && section.notes.length > 0 ? `
                    <div class="mb-4 flex flex-wrap gap-2">
                        ${section.notes.map(n => `<span class="text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 px-2 py-1 rounded-md mono leading-tight">${n}</span>`).join('')}
                    </div>
                ` : ''}
                ${Object.entries(groups).map(([groupName, groupRegs]) => `
                    <div class="mb-4 last:mb-0">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">${groupName}</span>
                            <div class="flex-1 h-px bg-slate-100 dark:bg-slate-800"></div>
                        </div>
                        <div class="tree-branch ml-2 pl-4 space-y-1">
                            ${groupRegs.map(r => renderRegisterNode(r, filterLower)).join('')}
                        </div>
                    </div>
                `).join('')}
            </div>
        </details>
        `;
    });

    container.innerHTML = html || '<p class="text-center text-slate-400 py-12 text-sm">Nenhum registrador encontrado para sua busca.</p>';

    const countEl = document.getElementById('searchCount');
    if (filterLower) {
        countEl.textContent = `${matchCount} encontrados`;
        countEl.classList.remove('hidden');
    } else {
        countEl.classList.add('hidden');
    }
}

function renderRegisterNode(r, filter) {
    const fc = r.function_code || '';
    const limitsHtml = (r.min !== undefined || r.max !== undefined)
        ? `<span class="text-[10px] mono text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/20 px-1.5 py-0.5 rounded border border-emerald-200 dark:border-emerald-800/40">Min: ${r.min ?? '—'} | Max: ${r.max ?? '—'}</span>`
        : '';
    const scaleHtml = r.scale && r.scale !== 1
        ? `<span class="text-[10px] mono text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 px-1.5 py-0.5 rounded border border-amber-200 dark:border-amber-800/40">÷${r.scale}</span>`
        : '';
    const modelosHtml = r.modelos && r.modelos.length > 0
        ? `<div class="flex flex-wrap gap-1 mt-1">${r.modelos.slice(0, 5).map(m => `<span class="text-[8px] mono bg-slate-100 dark:bg-slate-800 text-slate-500 px-1 py-0.5 rounded">${m}</span>`).join('')}${r.modelos.length > 5 ? `<span class="text-[8px] mono text-slate-400">+${r.modelos.length - 5}</span>` : ''}</div>`
        : '';

    return `
    <div class="node-enter flex items-start gap-3 p-2.5 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors group">
        <span class="text-sm mt-0.5">${getTypeIcon(r.data_type)}</span>
        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="mono text-[10px] font-bold px-1.5 py-0.5 rounded text-white shadow-sm ${getFcBadgeClass(fc)}">${fc}</span>
                <span class="mono text-[10px] text-slate-400 dark:text-slate-500 font-semibold bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded">#${r.address}</span>
                <span class="text-sm font-semibold text-slate-800 dark:text-slate-200 truncate">${highlightText(r.name, filter)}</span>
                ${r.unit && r.unit !== 'bool' && r.unit !== 'enum' ? `<span class="text-[10px] text-slate-400 dark:text-slate-500 font-medium">(${r.unit})</span>` : ''}
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 leading-relaxed">${highlightText(r.description || '', filter)}</p>
            <div class="flex items-center gap-2 mt-1 flex-wrap">
                ${r.data_type ? `<span class="text-[10px] mono text-indigo-500 dark:text-indigo-400">${r.data_type}</span>` : ''}
                ${scaleHtml}
                ${limitsHtml}
            </div>
            ${modelosHtml}
        </div>
    </div>
    `;
}

function highlightText(text, filter) {
    if (!filter || !text) return text;
    const regex = new RegExp(`(${filter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(regex, '<mark class="search-highlight">$1</mark>');
}

function expandAll() {
    document.querySelectorAll('#treeContainer details').forEach(d => d.open = true);
}
function collapseAll() {
    document.querySelectorAll('#treeContainer details').forEach(d => d.open = false);
}

// === Inicialização ===
const sections = parseData(REGISTER_DATA);
renderStats(sections);
renderTree(sections);

// Pesquisa com debounce
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimeout);
    const val = this.value;
    searchTimeout = setTimeout(() => renderTree(sections, val), 200);
});
</script>
