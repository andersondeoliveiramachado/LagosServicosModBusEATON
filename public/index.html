<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagos Serviços - Dashboard Avançado</title>
    <!-- Bibliotecas Offline -->
    <script src="/tailwindcss.js"></script>
    <script src="/chart.js"></script>
    
    <script>
        // Configuração do Tailwind nativo via script
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: '#2563eb' },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'flash-red': 'flashRed 1.5s infinite'
                    },
                    keyframes: {
                        flashRed: {
                            '0%, 100%': { backgroundColor: 'transparent' },
                            '50%': { backgroundColor: 'rgba(239, 68, 68, 0.15)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Toast Container */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; padding: 15px; border-radius: 8px; font-weight: 500; font-size: 14px; color: white; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); animation: slideIn 0.3s ease-out; }
        .toast.error { background: #ef4444; }
        .toast.success { background: #10b981; }
        .toast.warning { background: #f59e0b; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Custom scrollbar para tabelas */
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Fix Chart flicker em algums renderizadores webkit */
        canvas { -moz-user-select: none; -webkit-user-select: none; -ms-user-select: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300 min-h-screen pb-10">

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Cabeçalho Principal -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div class="flex items-center gap-4">
            <img src="logo.png" alt="Logo Lagos Serviços" class="h-12 w-auto object-contain rounded drop-shadow-sm dark:brightness-90 transition-all">
            <div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand to-emerald-500">Centro de Monitoramento EATON</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium tracking-wide">MODBUS RTU ANALYSIS ENGINE</p>
            </div>
        </div>
        
        <div class="flex gap-3">

            <button id="themeToggle" class="flex items-center justify-center p-2 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-all text-slate-600 dark:text-slate-300 hover:text-brand dark:hover:text-brand" aria-label="Alternar Tema">
                <svg id="themeIconDark" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                <svg id="themeIconLight" class="w-5 h-5 block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
            </button>

    <!-- KPIs Dinâmicos (Cartões no Topo) -->

        <!-- Esqueletos iniciais -->

            <p class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1">Aguardando...</p>
            <div class="flex items-baseline gap-1 mt-1"><span class="text-3xl font-bold text-slate-300 dark:text-slate-600">--</span></div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/50 flex flex-col justify-center">
            <p class="text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1">Aguardando...</p>

        </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 mb-8">
        
        <!-- Bloco Esquerdo: Controles & Configurações -->

                <div class="flex items-center gap-3 mb-4">

                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    </div>

                <form id="uploadForm" class="flex flex-col gap-3">

            <!-- Configuração Serial -->

                 <div class="flex items-center gap-3 mb-5">

                    </div>
                    <h3 class="font-bold text-lg">Conexão Serial</h3>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Porta (COM)</label>

                        <input type="number" id="baudRate" value="9600" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-md px-3 py-2 text-sm focus:ring-1 focus:ring-brand outline-none transition-all">

                    </button>

                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" /></svg> Desconectar
                    </button>

        <!-- Bloco Direito: Gráfico Real-time -->

                <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-lg">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" /></svg>
                    </div>
                    <h3 class="font-bold text-lg">Histórico (Trend)</h3>
                </div>
                <div class="text-xs text-slate-500 dark:text-slate-400" id="chartLegend">Gráfico Vivo</div>

            <div class="relative flex-1 w-full" style="min-height: 280px; max-height: 400px;">

    <!-- Tabela de Dados Completa -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/50 p-6 overflow-hidden flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg">Registradores Completos</h3>
            <span class="text-xs px-2 py-1 bg-slate-100 dark:bg-slate-700 rounded-md text-slate-500 dark:text-slate-400" id="tableCount">0 Lidos</span>

        <div class="overflow-x-auto custom-scrollbar">

                    <tr class="border-b border-slate-200 dark:border-slate-700 text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400 font-semibold bg-slate-50/50 dark:bg-slate-800/50">
                        <th class="py-3 px-4 rounded-tl-lg">Parâmetro</th>
                        <th class="py-3 px-4 text-right">Valor Atual</th>
                        <th class="py-3 px-4 rounded-tr-lg w-24">Faixa</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50">
                    <tr><td colspan="3" class="py-8 text-center text-sm text-slate-400">Aguardando comunicação...</td></tr>
                </tbody>
            </table>
        </div>

</div>

<!-- Container para Notificações -->
<div id="toast-container"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
    // Gerenciador de Avisos Flutuantes (Toasts)
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `
            <span>${message}</span>
            <button onclick="this.parentElement.remove()" class="ml-4 opacity-70 hover:opacity-100 focus:outline-none">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        `;
        container.appendChild(toast);
        // Toca alerta sonoro se for warning ou error
        if(type === 'error' || type === 'warning') {
            try {
                let context = new (window.AudioContext || window.webkitAudioContext)();
                let osc = context.createOscillator();
                let gain = context.createGain();
                osc.connect(gain);
                gain.connect(context.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, context.currentTime);
                gain.gain.setValueAtTime(0.1, context.currentTime);
                osc.start();
                osc.stop(context.currentTime + 0.1);
            } catch(e) {}
        }
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100%)';
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    // Gerenciamento de Tema
    const themeToggle = document.getElementById('themeToggle');
    const iconLight = document.getElementById('themeIconLight');
    const iconDark = document.getElementById('themeIconDark');
    const savedTheme = localStorage.getItem('theme');
    const isDark = savedTheme === 'dark' || (!savedTheme && document.documentElement.classList.contains('dark'));
    
    function applyTheme(dark) {
        if (dark) {
            document.documentElement.classList.add('dark');
            iconLight.classList.remove('hidden');
            iconDark.classList.add('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            iconLight.classList.add('hidden');
            iconDark.classList.remove('hidden');
        }
        Chart.defaults.color = dark ? '#94a3b8' : '#64748b'; // Ajusta cor de texto do grafico
        if(chart) chart.update();
    }
    
    applyTheme(isDark);
    
    themeToggle.addEventListener('click', () => {
        const darken = !document.documentElement.classList.contains('dark');
        applyTheme(darken);
        localStorage.setItem('theme', darken ? 'dark' : 'light');
    });

    // Chart.js Setup
    const ctx = document.getElementById('realtimeChart').getContext('2d');
    const maxDataPoints = 30; // Mostrar até N pontos históricos lineares
    let chartParams = []; // nomes dos parametros graficos
    
    // Gradiente para os gráficos
    const gradientBrand = ctx.createLinearGradient(0, 0, 0, 400);
    gradientBrand.addColorStop(0, 'rgba(37, 99, 235, 0.4)');   // brand
    gradientBrand.addColorStop(1, 'rgba(37, 99, 235, 0.0)');
    
    const gradientEmerald = ctx.createLinearGradient(0, 0, 0, 400);
    gradientEmerald.addColorStop(0, 'rgba(16, 185, 129, 0.4)'); // emerald
    gradientEmerald.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

    var chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [], 
            datasets: [] // populado dinamicamente via socket
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 0 }, // tira animacao de redimensionamento para não engasgar
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', titleColor: '#fff', padding: 10, cornerRadius: 4 }
            },
            scales: {
                x: { 
                    grid: { display: false, drawBorder: false },
                    ticks: { maxTicksLimit: 10, autoSkip: true }
                },
                y: { 
                    grid: { color: 'rgba(148, 163, 184, 0.1)', drawBorder: false },
                    beginAtZero: false 
                }
            }
        }
    });

    // Helper functions
    function updateSerialBadge(connected) {
        const badge = document.getElementById('serialStatusBadge');
        if (connected) {
            badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span> Ativo`;
            badge.className = "flex items-center px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 border border-emerald-200 dark:bg-emerald-900/40 dark:text-emerald-400 dark:border-emerald-800 transition-all";
            document.getElementById('connectBtn').classList.add('hidden');
            document.getElementById('disconnectBtn').classList.remove('hidden');
            document.getElementById('disconnectBtn').classList.add('flex');
        } else {
            badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-2"></span> Off`;
            badge.className = "flex items-center px-3 py-1.5 rounded-full text-xs font-bold bg-red-100 text-red-700 border border-red-200 dark:bg-red-900/40 dark:text-red-400 dark:border-red-800 transition-all";
            document.getElementById('connectBtn').classList.remove('hidden');
            document.getElementById('disconnectBtn').classList.add('hidden');
            document.getElementById('disconnectBtn').classList.remove('flex');
        }
    }

    // Formularios (Upload e Serial)
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('mapFile');
        const formData = new FormData();
        formData.append('mapFile', fileInput.files[0]);
        const status = document.getElementById('uploadStatus');

        try {
            status.innerText = "Processando..."; status.className = "mt-3 text-sm font-medium text-amber-500";
            const response = await fetch('/upload-map', { method: 'POST', body: formData });
            const result = await response.json();
            
            status.innerText = result.message;
            if (result.success) {
                status.className = "mt-3 text-sm font-medium text-emerald-500";
                showToast("Mapa Atualizado com sucesso!", "success");
            } else {
                status.className = "mt-3 text-sm font-medium text-red-500";
                showToast(result.message, "error");
            }
        } catch (error) {
            status.innerText = 'Erro ao enviar o arquivo.';
            status.className = "mt-3 text-sm font-medium text-red-500";
        }
    });

    async function conectarSerial() {
        const config = {
            port: document.getElementById('serialPort').value,
            baudRate: parseInt(document.getElementById('baudRate').value),
            dataBits: parseInt(document.getElementById('dataBits').value),
            stopBits: parseInt(document.getElementById('stopBits').value),
            parity: document.getElementById('parity').value,
            slaveId: parseInt(document.getElementById('slaveId').value)
        };
        const status = document.getElementById('configStatus');
        try {
            status.innerText = 'Acionando rádio...'; status.className = "mt-3 text-sm font-medium text-amber-500 text-center";
            const response = await fetch('/api/connect-serial', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(config) });
            const result = await response.json();
            status.innerText = result.message;
            if (result.success) {
                status.className = "mt-3 text-sm font-medium text-emerald-500 text-center";
                showToast("Conexão estabelecida", "success");
            } else {
                status.className = "mt-3 text-sm font-medium text-red-500 text-center";
                showToast(result.message, "error");
            }
        } catch (e) {
            status.innerText = 'Falha na rede: ' + e.message;
            status.className = "mt-3 text-sm font-medium text-red-500 text-center";
        }
    }

    async function desconectarSerial() {
        const status = document.getElementById('configStatus');
        try {
            const response = await fetch('/api/disconnect-serial', { method: 'POST' });
            const result = await response.json();
            status.innerText = result.message;
            status.className = result.success ? "mt-3 text-sm font-medium text-slate-500 text-center" : "mt-3 text-sm font-medium text-red-500 text-center";
        } catch (e) {
            status.innerText = 'Erro ao desconectar.';
        }
    }

    // Lógica em Tempo Real WebSocket
    const socket = io();
    const tbody = document.getElementById('dataTableBody');
    const kpiContainer = document.getElementById('kpi-container');
    
    // Armazena alarmes já notificados para não sobrecarregar
    const activeAlarms = new Set();

    socket.on('modbus-data', (data) => {
        if (!data || data.length === 0) return;
        
        // --- 1. Atualizar Tabela e Alarmes ---
        tbody.innerHTML = '';
        document.getElementById('tableCount').innerText = `${data.length} Lidos`;
        
        data.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.className = "group hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors";
            
            const numValue = parseFloat(item.value);
            let stateClass = "";
            let stateText = "<span class='text-emerald-500 flex items-center'><span class='w-1.5 h-1.5 rounded-full bg-emerald-500 mr-2'></span> OK</span>";
            let isAlarm = false;

            // Checa Limites (Alarme!) se existirem injetados no objeto (requer atualizar o backend ou enviar mockado via front)
            // Como o mapa json tem "min" e "max", recebemos do item se o envio prever eles.
            // Para simplificar a demo estendida, verificamos se item.min ou .max existe na origem.
            if (item.value !== '---' && !isNaN(numValue)) {
                if (item.min !== undefined && numValue < item.min) { isAlarm = true; stateText = `Baixo (<${item.min})`; }
                if (item.max !== undefined && numValue > item.max) { isAlarm = true; stateText = `Alto (>${item.max})`; }
            }

            if (isAlarm) {
                stateClass = "animate-flash-red";
                stateText = `<span class='text-red-500 flex items-center font-bold'><span class='w-1.5 h-1.5 rounded-full bg-red-500 mr-2 animate-pulse'></span> ALARME</span>`;
                
                if (!activeAlarms.has(item.name)) {
                    showToast(`⚠️ Alerta Crítico: O parâmetro "${item.name}" excedeu o limite seguro (${item.value}${item.unit})`, 'error');
                    activeAlarms.add(item.name);
                }
            } else {
                activeAlarms.delete(item.name); // Recuperou
            }

            tr.innerHTML = `
                <td class="py-4 px-4 font-medium text-slate-800 dark:text-slate-200 border-b border-slate-100 dark:border-slate-700/50 ${stateClass}">${item.name}</td>
                <td class="py-4 px-4 text-right border-b border-slate-100 dark:border-slate-700/50 ${stateClass}">
                    <span class="text-xl font-bold font-mono ${isAlarm ? 'text-red-500' : 'text-slate-700 dark:text-white'}">${item.value}</span>
                    <span class="text-xs ml-1 text-slate-400">${item.unit}</span>
                </td>
                <td class="py-4 px-4 text-xs font-semibold border-b border-slate-100 dark:border-slate-700/50 ${stateClass}">${stateText}</td>
            `;
            tbody.appendChild(tr);
        });

        // --- 2. Atualizar Cartões KPI ---
        // Pega os 4 primeiros itens
        const kpis = data.slice(0, 4);
        kpiContainer.innerHTML = '';
        kpis.forEach(kpi => {
            let numValue = parseFloat(kpi.value);
            let isAlarm = false;
            
            if (kpi.value !== '---' && !isNaN(numValue)) {
                if ((kpi.min !== undefined && numValue < kpi.min) || (kpi.max !== undefined && numValue > kpi.max)) isAlarm = true;
            }
            
            const pClass = isAlarm 
                ? "bg-red-50 dark:bg-red-900/20 shadow-md border-red-200 dark:border-red-800/50 animate-pulse" 
                : "bg-white dark:bg-slate-800 shadow-sm border-slate-100 dark:border-slate-700/50";
                
            const titleClass = isAlarm ? "text-red-500" : "text-slate-400 dark:text-slate-500";
            const valClass = isAlarm ? "text-red-600 dark:text-red-400" : "text-brand dark:text-blue-400 font-mono";

            kpiContainer.innerHTML += `
                <div class="p-5 rounded-2xl border transition-all duration-300 flex flex-col justify-center ${pClass}">
                    <p class="text-xs font-bold uppercase tracking-widest mb-1 ${titleClass} truncate" title="${kpi.name}">${kpi.name}</p>
                    <div class="flex items-baseline gap-1 mt-1">
                        <span class="text-3xl font-black ${valClass}">${kpi.value}</span>
                        <span class="text-sm font-semibold opacity-60 ${valClass}">${kpi.unit}</span>
                    </div>
                </div>
            `;
        });

        // --- 3. Atualizar Gráfico Histórico ---
        // Vamos extrair 2 parâmetros para desenhar. Ex: os 2 primeiros.
        if (data.length >= 1) {
            const timeLabel = new Date().toLocaleTimeString([], { hour12: false, second: '2-digit', minute: '2-digit', hour: '2-digit' });
            chart.data.labels.push(timeLabel);
            
            // Inicializa datasets se vazio
            if(chart.data.datasets.length === 0) {
                // Dataset 1
                chart.data.datasets.push({
                    label: data[0].name,
                    data: [],
                    borderColor: '#2563eb', // brand
                    backgroundColor: gradientBrand,
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    fill: true,
                    tension: 0.3
                });
                // Dataset 2 (se existir)
                if(data.length > 1) {
                    chart.data.datasets.push({
                        label: data[1].name,
                        data: [],
                        borderColor: '#10b981', // emerald
                        backgroundColor: gradientEmerald,
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.3
                    });
                }
                const chnames = [data[0].name];
                if(data[1]) chnames.push(data[1].name);
                document.getElementById('chartLegend').innerHTML = `<span class="px-2 py-0.5 rounded mr-2 bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">▪ ${data[0].name}</span>` + 
                (data[1] ? `<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 dark:bg-emerald-900 dark:text-emerald-200">▪ ${data[1].name}</span>` : '');
            }

            // Alimentar Ponto
            chart.data.datasets[0].data.push(parseFloat(data[0].value) || 0);
            if(chart.data.datasets[1] && data.length > 1) {
                chart.data.datasets[1].data.push(parseFloat(data[1].value) || 0);
            }

            // Exclui pto velho (sliding window)
            if (chart.data.labels.length > maxDataPoints) {
                chart.data.labels.shift();
                chart.data.datasets.forEach(dst => dst.data.shift());
            }
            
            chart.update('none'); // Update sem animacao pra performance real-time
        }
    });

    socket.on('serial-status', (status) => updateSerialBadge(status.connected));
    
    socket.on('serial-error', (data) => {
        showToast(data.message, "warning");
        const status = document.getElementById('configStatus');
        status.innerText = data.message;
        status.className = "mt-3 text-sm font-medium text-amber-500 text-center";
    });

</script>

</body>
</html>
